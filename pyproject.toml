[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-knowledge-base"
version = "0.1.0"
description = "Локальная персональная база знаний для публикаций Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keyring>=25,<26",
    "platformdirs>=4.3,<5",
    "Telethon>=1.45,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telegram_knowledge_base = ["adapters/storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
